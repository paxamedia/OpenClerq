name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Quality gates that must pass before the build workflow's artifacts mean anything.
# Before release 0.4 none of this ran: CI only built installers.
jobs:
  verify:
    name: Typecheck, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      # One version across every package, the Tauri config, the desktop crate
      # and /health. Five packages once drifted because nothing checked.
      - name: Versions in sync
        run: node scripts/sync-version.js --check

      - name: Typecheck gateway
        run: pnpm --filter @clerq/gateway exec tsc --noEmit

      - name: Typecheck desktop
        run: pnpm --filter @clerq/desktop exec tsc --noEmit

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm -r test

      # The desktop app's built frontend, served with the Content-Security-Policy from
      # tauri.conf.json, in the runner's Chrome, against a real gateway: every main screen must
      # draw with no violation (scripts/check-csp.mjs). It uses the packages built above.
      - name: Desktop CSP check
        run: node scripts/check-csp.mjs

  # The security-critical tests that only mean anything on macOS: the seatbelt
  # sandbox (including the live egress-allowlist check) and the keychain
  # round-trip. On Linux they are skipped, so without this job they would
  # never run in CI at all.
  verify-macos:
    name: Tests on macOS (seatbelt, keychain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Unit and integration tests
        run: pnpm -r test

  # The server as people will install it, on the two Linux CPUs the release ships. The
  # release's own packaging script builds clerq-server, clerq and clerq-calc and packs the
  # tarball; then the compiled server is started, asked over HTTP and stopped with SIGTERM
  # (smoke.mjs), the installer is run against a release folder made of that tarball and
  # served from this machine (test-install.sh: checksums, a tampered file, the installed
  # programs working together, sudo and --system), and systemd reads both units. The unit
  # tests of apps/server run in `verify` (node) and `verify-macos`; this is the compiled
  # program on the platforms it is for. The same scripts run on a developer's Mac against
  # a darwin build.
  server-linux:
    name: Server binary, installer and systemd units (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # bun: where the compiled files land (apps/server/dist/<bun>/); x64 is Bun's
          # baseline build, which runs on a CPU without AVX2.
          - target: linux-x64
            bun: bun-linux-x64-baseline
            runner: ubuntu-latest
          - target: linux-arm64
            bun: bun-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/calculation-core

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build clerq-calc
        run: cargo build --release --manifest-path packages/calculation-core/Cargo.toml

      # Builds the workspace packages, compiles clerq-server (with clerq-calc beside it)
      # and clerq with Bun into apps/server/dist/bun-<target>/ and apps/cli/dist/bun-<target>/,
      # and writes server-files/openclerq-server-<version>-<target>.tar.gz.
      - name: Package the server files
        run: node scripts/package-server.js --target ${{ matrix.target }} --out-dir server-files

      - name: Smoke test
        run: node apps/server/scripts/smoke.mjs apps/server/dist/${{ matrix.bun }}/clerq-server

      # The same shellcheck on both CPUs: the official static build at a fixed version, checked
      # against the checksum recorded here (taken from that release's own download; the release
      # publishes none). The runner images carry different versions (the arm64 one has none,
      # and Ubuntu's own package is older than the x64 image's), and they disagree about what to
      # report. The scripts are also clean under 0.10 and 0.11.
      - name: Install shellcheck 0.11.0
        run: |
          version=v0.11.0
          case "$(uname -m)" in
            x86_64) arch=x86_64; sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            aarch64) arch=aarch64; sha256=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "No shellcheck build for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="shellcheck-$version.linux.$arch.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$version/$archive"
          echo "$sha256  $archive" | sha256sum --check -
          tar -xJf "$archive"
          sudo install -m 0755 "shellcheck-$version/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # The real minisign, so the installer's signature check runs against the tool a user has
      # and not against the stand-in the test falls back to.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      # install.sh against a fake release folder (the tarball, SHA256SUMS with a signature made
      # for the run, install.sh) served on 127.0.0.1, into a temporary folder. The runner's
      # passwordless sudo lets it also run the root cases: refusing to run as root, and --system.
      - name: Test the installer
        run: apps/server/scripts/test-install.sh server-files/openclerq-server-*-${{ matrix.target }}.tar.gz
        env:
          CLERQ_TEST_SUDO: '1'
          CLERQ_TEST_REQUIRE_SHELLCHECK: '1'
          CLERQ_TEST_REQUIRE_MINISIGN: '1'

      # systemd checks the files for unknown directives, bad values, a missing
      # ExecStart binary and an unknown user. The binary and the account are put
      # where the units expect them first.
      - name: Verify the systemd units
        run: |
          command -v systemd-analyze || { sudo apt-get update && sudo apt-get install -y systemd; }
          systemd-analyze --version | head -n 1
          bin=apps/server/dist/${{ matrix.bun }}
          sudo install -m 0755 "$bin/clerq-server" "$bin/clerq-calc" /usr/local/bin/
          sudo useradd --system --user-group --no-create-home --home-dir /var/lib/openclerq --shell /usr/sbin/nologin openclerq
          systemd-analyze verify --man=no apps/server/systemd/openclerq.service
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin/clerq-server" "$HOME/.local/bin/clerq-server"
          systemd-analyze --user verify --man=no apps/server/systemd/openclerq-user.service

  # The container image, built from the same Dockerfile the release publishes, on a
  # native runner for each architecture (nothing emulated), not pushed. test-image.sh
  # starts it the way SERVER.md says and checks it: the health check, the API, the
  # token, the user, the tools inside, a restart, the data volume, docker stop.
  docker:
    name: Container image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: >-
          docker build -f apps/server/Dockerfile
          --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }}
          -t openclerq:ci .

      - run: docker image ls openclerq:ci

      - name: Test the image
        run: apps/server/scripts/test-image.sh openclerq:ci

  # The container profile on a real engine: the sandbox package's tests and the gateway's, with
  # CLERQ_TEST_CONTAINER_RUNTIME=docker, which turns on the suites that are skipped everywhere else
  # (packages/sandbox/src/container.real.test.ts and the last describe of
  # packages/gateway/src/automations/sandbox.integration.test.ts). They pull alpine and node, run
  # commands in containers and look from inside at the mounts, the user and the privileges, reach
  # example.com through the egress proxy and nothing else, stop and time out runs, sweep what a
  # dead gateway left, and run a builtin agent and its gate end to end. The ordinary `verify` job
  # skips them: the variable is not set there, although the runner has Docker.
  #
  # NOT REQUIRED YET. The profile had only ever run against a fake `docker` until this job, so the
  # first runs may find what the fake could not. `continue-on-error` keeps main green while they
  # are fixed; remove it (and make the job a required check) once both CPUs have been green on
  # main. On a failure each test prints the docker command lines it ran (never their environment),
  # every container and network labelled clerq.run with its state and logs (the egress proxy's
  # too), and the job prints the same once more and uploads the files (scripts/container-debug.sh).
  container-profile:
    name: Container profile on a real engine (${{ matrix.arch }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CLERQ_TEST_CONTAINER_RUNTIME: docker
      CLERQ_TEST_DEBUG_DIR: ${{ github.workspace }}/container-debug
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gateway's tests import the built workspace packages (@clerq/sandbox, drivers, ...).
      - name: Build the packages the tests import
        run: pnpm --filter '@clerq/gateway^...' build

      - name: The engine
        run: |
          id
          docker version
          docker info

      - name: Sandbox tests on the engine
        run: pnpm --filter @clerq/sandbox exec vitest run src/container.real.test.ts --reporter=verbose

      # Also after a failure above, so one run shows both suites.
      - name: Gateway tests on the engine
        if: ${{ !cancelled() }}
        run: >-
          pnpm --filter @clerq/gateway exec vitest run
          src/automations/sandbox.integration.test.ts
          -t 'real container engine' --reporter=verbose

      - name: What the engine holds
        if: ${{ failure() }}
        run: scripts/container-debug.sh docker "$CLERQ_TEST_DEBUG_DIR/docker-calls.log"

      - name: Keep the debug files
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: container-profile-debug-${{ matrix.arch }}
          path: ${{ env.CLERQ_TEST_DEBUG_DIR }}
          if-no-files-found: ignore

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/calculation-core

      - name: Format check
        run: cargo fmt --manifest-path packages/calculation-core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path packages/calculation-core/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path packages/calculation-core/Cargo.toml

  # The desktop crate links the system webview. On macOS that needs no extra
  # packages, and it is the platform the desktop build runs on first.
  rust-desktop:
    name: Desktop crate checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      # tauri-build expects the sidecars and the built frontend to exist. Clippy
      # and the unit tests never start them, so empty stand-ins are enough.
      - name: Stand-in sidecars and frontend
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/dist apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/clerq-gateway-$triple"
          touch "apps/desktop/src-tauri/binaries/clerq-calc-$triple"

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on moderate and above. A high-only gate let three moderate
      # request-parsing DoS advisories (qs, via express) through unnoticed —
      # on the one code path every request takes. Low still passes, so a
      # cosmetic transitive advisory does not block every PR.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary: `cargo install cargo-audit` compiles for several
      # minutes on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (calculation engine)
        run: cargo audit --file packages/calculation-core/Cargo.lock

      # The ignored zip advisories: zip 4 comes only from tauri-plugin-updater
      # 2.x, on Windows, which unpacks an update only after its minisign
      # signature verifies. No 4.x release has the fixes. Remove the ignores
      # once the updater moves to zip 9.
      - name: cargo audit (desktop)
        run: >-
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
