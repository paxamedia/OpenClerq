name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Quality gates that must pass before the build workflow's artifacts mean anything.
# Before release 0.4 none of this ran: CI only built installers.
jobs:
  verify:
    name: Typecheck, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      # One version across every package, the Tauri config, the desktop crate
      # and /health. Five packages once drifted because nothing checked.
      - name: Versions in sync
        run: node scripts/sync-version.js --check

      - name: Typecheck gateway
        run: pnpm --filter @clerq/gateway exec tsc --noEmit

      - name: Typecheck desktop
        run: pnpm --filter @clerq/desktop exec tsc --noEmit

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm -r test

  # The security-critical tests that only mean anything on macOS: the seatbelt
  # sandbox (including the live egress-allowlist check) and the keychain
  # round-trip. On Linux they are skipped, so without this job they would
  # never run in CI at all.
  verify-macos:
    name: Tests on macOS (seatbelt, keychain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Unit and integration tests
        run: pnpm -r test

  # The server as the Linux binary people will install: compiled with Bun, started
  # with a temporary HOME, asked over HTTP, stopped with SIGTERM; and both systemd
  # units read by systemd itself. The unit tests of apps/server run in `verify`
  # (node) and `verify-macos`; this is the compiled program on the platform it is
  # for. The same smoke script runs on a developer's Mac against a darwin build.
  server-linux:
    name: Server binary and systemd units (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/calculation-core

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build clerq-calc
        run: cargo build --release --manifest-path packages/calculation-core/Cargo.toml

      # Builds the workspace packages the server imports, then compiles it with
      # Bun into apps/server/dist/bun-linux-x64/ together with clerq-calc.
      - name: Build the linux-x64 server binary
        run: >-
          node scripts/build-binary.js
          --entry apps/server/src/main.ts --name clerq-server
          --target bun-linux-x64 --require-calc

      - name: Smoke test
        run: node apps/server/scripts/smoke.mjs apps/server/dist/bun-linux-x64/clerq-server

      # systemd checks the files for unknown directives, bad values, a missing
      # ExecStart binary and an unknown user. The binary and the account are put
      # where the units expect them first.
      - name: Verify the systemd units
        run: |
          command -v systemd-analyze || sudo apt-get install -y systemd
          systemd-analyze --version | head -n 1
          bin=apps/server/dist/bun-linux-x64
          sudo install -m 0755 "$bin/clerq-server" "$bin/clerq-calc" /usr/local/bin/
          sudo useradd --system --user-group --home-dir /var/lib/openclerq --shell /usr/sbin/nologin openclerq
          systemd-analyze verify --man=no apps/server/systemd/openclerq.service
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin/clerq-server" "$HOME/.local/bin/clerq-server"
          systemd-analyze --user verify --man=no apps/server/systemd/openclerq-user.service

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/calculation-core

      - name: Format check
        run: cargo fmt --manifest-path packages/calculation-core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path packages/calculation-core/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path packages/calculation-core/Cargo.toml

  # The desktop crate links the system webview. On macOS that needs no extra
  # packages, and it is the platform the desktop build runs on first.
  rust-desktop:
    name: Desktop crate checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      # tauri-build expects the sidecars and the built frontend to exist. Clippy
      # and the unit tests never start them, so empty stand-ins are enough.
      - name: Stand-in sidecars and frontend
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/dist apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/clerq-gateway-$triple"
          touch "apps/desktop/src-tauri/binaries/clerq-calc-$triple"

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on moderate and above. A high-only gate let three moderate
      # request-parsing DoS advisories (qs, via express) through unnoticed —
      # on the one code path every request takes. Low still passes, so a
      # cosmetic transitive advisory does not block every PR.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary: `cargo install cargo-audit` compiles for several
      # minutes on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (calculation engine)
        run: cargo audit --file packages/calculation-core/Cargo.lock

      # The ignored zip advisories: zip 4 comes only from tauri-plugin-updater
      # 2.x, on Windows, which unpacks an update only after its minisign
      # signature verifies. No 4.x release has the fixes. Remove the ignores
      # once the updater moves to zip 9.
      - name: cargo audit (desktop)
        run: >-
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
